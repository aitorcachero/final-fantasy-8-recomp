# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Final Fantasy VIII"
id = "SLES-02084"
players = 1
exe = "disc/SLES_020.84"
disc = "disc/Final Fantasy VIII (Spain) (Disc 1).cue"
# Verified as one program on N images (verify_disc_set.py).
# Disc 1 boots; the rest are data. The runtime builds its disc
# roster from this list and mounts the SELECTED one (remembered
# in disc_index), so the launcher can switch discs between runs.
discs = [
    "disc/Final Fantasy VIII (Spain) (Disc 1).cue",
    "disc/Final Fantasy VIII (Spain) (Disc 2).cue",
    "disc/Final Fantasy VIII (Spain) (Disc 3).cue",
    "disc/Final Fantasy VIII (Spain) (Disc 4).cue",
]
load_address = "0x80010000"
entry_pc = "0x80011860"
text_size = "0x00050000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Final Fantasy VIII (Spain) (Disc 1).bin"
cue_name = "Final Fantasy VIII (Spain) (Disc 1).cue"
boot_exe = "SLES_020.84"
known_sizes = [732426912]
known_md5 = [
  "093ebeff24482d5de4547283db3ce676",
]
known_sha1 = [
  "01fd9456089e17b742e15693591e6d0e7e96be72",
]
known_crc32 = [
  "568140bf",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = false

[runtime]
window_title = "Final Fantasy VIII Recompiled (4K 60FPS 16:9 Master Edition)"
memcard_dir = "saves"
overlay_cache = true
idle_skip = false
overlay_region_floor = "0x60000"

[video]
renderer = "opengl"
internal_resolution = "4k"
supersample = 2.0
resolution_reference_lines = 240
match_display_max_lines = 2160
antialiasing_mode = "fxaa_hq"
texture_filtering = "bilinear"
texture_lod = "mipmap"
anisotropic_filtering = 16
bloom = 0.20
geometry_correction = true
perspective_texturing = true
pgxp_cpu_mode = false
pgxp_preserve_projection = false
pgxp_depth_buffer = true
dithering = "fine"
accurate_blending = true
fmv_chroma_smoothing = true
fmv_filter = "bicubic"
render_thread = false
present_thread = false
vsync = "off"
frame_interpolation = false
frame_interpolation_fps = 0
offer_frame_interpolation = false
frame_generation = false
frame_generation_method = "redraw"
aspect_ratio = "16:9"

[widescreen]
offer = true
offer_ultrawide = true
gte_game_mode = true
native_wide = true

[audio]
buffer_ms = 180
spu_hq = true

[controller]
default_mode = "analog"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "fcadc3198592d4432d7d3e4fe96e1bb3989aff4abf9c6cee9057a7b60733b798"
